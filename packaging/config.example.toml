[server]
listen = "127.0.0.1:1234"
# The account the service runs as; `eliezer --import` hands imported model files to it.
run_user = "eliezer"
run_group = "eliezer"
# Optional: api_keys_file = "/etc/eliezer/keys"
request_timeout_secs = 600

[storage]
models_dir = "/var/lib/eliezer/models"

[gpu]
vendor = "auto"
index = 0
vram_budget_gb = 24.0
reserve_gb = 2.0
measure = "auto"

# Optional: let language models run in system memory while a diffusion model holds the GPU.
# [cpu]
# ram_budget_gb = 0.0   # 0 turns CPU placement off
# reserve_gb = 4.0

[scheduler]
idle_unload_secs = 1800
queue_max = 64
queue_wait_secs = 120

[huggingface]
# Optional: token_file = "/etc/eliezer/hf-token"
cache_dir = "/var/lib/eliezer/models/hf"
cache_limit_gb = 200.0
downloads = "on_request"
search = true            # allow `eliezer search` (public metadata of Hugging Face, no token)
# allow = ["leejet/*", "*/Qwen3-VL*"]   # repositories `eliezer get` may fetch from; `*` is a wildcard in a part (empty: none)

[backend.mistralrs]
enabled = true
max_loaded = 4

[backend.llamacpp]
enabled = false
max_loaded = 4

[backend.sdcpp]
program = "/usr/libexec/x86_64-linux-gnu/eliezer/sd-server"
port_range = [24600, 24609]
# library_path = ["/usr/lib/x86_64-linux-gnu/eliezer", "/opt/rocm/lib/llvm/lib"]   # ROCm libraries and libomp of sd-server
# An image model that edits pictures (POST /v1/images/edits) has `extra = { ..., image_edit = true }`, for example
# FLUX.2 klein 4B (text_encoder: Qwen3-4B, steps = 4, cfg_scale = 1.0).

# Music models (MiniMax Music 3) through audio.cpp: POST /v1/audio/speech with lyrics (`input`) and a description of the
# music (`instructions`). Uncomment both blocks and download the package with
# `eliezer download audio-cpp/MiniMax-Music3-GGUF config.json config/*.json tokenizer/tokenizer.json tokenizer/tokenizer_config.json
#  condition_encoder.gguf rvq_depth_decoder_q8_0.gguf transformer_q4_0.gguf vocoder.gguf language_model_q4_0.gguf` (about 8.4 GB).
# [backend.audiocpp]
# program = "/usr/libexec/x86_64-linux-gnu/eliezer/audiocpp_server"
# port_range = [24700, 24709]
# compute = "hip"                      # "hip" (AMD), "cuda", "vulkan" or "cpu"
#
# [[model]]
# key = "music3"
# backend = "audiocpp"
# kind = "music"
# source = { file = "/var/lib/eliezer/models/audio-cpp/MiniMax-Music3-GGUF" }   # the package directory
# vram_gb = 10.0
# extra = { duration_sec = 30, steps = 30, cfg_scale = 1.7 }

# Speech synthesis with voice cloning (text to speech) through the same audio.cpp program: POST /v1/audio/speech with `input` (the
# text) and `voice` (a name from GET /v1/audio/voices). The program must be built with the family
# (`AUDIOCPP_MODELS=minimax_music3,chatterbox scripts/build-audiocpp.sh`). Download the model with
# `eliezer download audio-cpp/audio.cpp-gguf Chatterbox-GGUF/chatterbox-q8_0.gguf` (MIT, 2.1 GB; list audio-cpp/audio.cpp-gguf in
# [huggingface] allow first). Alternative family: cosyvoice3 (`CosyVoice3-GGUF/cosyvoice3-q8_0.gguf`, needs the words of the sample in
# <name>.txt). No voices come with the package: put `<name>.wav` (and `<name>.txt`) of people who agreed into voices_dir, or upload
# them with POST /v1/audio/voices. Consent and profiles are the business of the calling application, not of Eliezer.
# [backend.audiocpp]
# voices_dir = "/var/lib/eliezer/models/voices"   # default: "voices" inside storage.models_dir; mode 0700, never served
# max_input_chars = 100000             # longest text of one request (413 above); a model can set its own in extra
# max_passage_chars = 400              # the text is cut into passages of at most this many characters, at sentence boundaries
# pause_ms = 400                       # silence between two passages; paragraph_pause_ms = 800 after a paragraph
# voice_max_file_mb = 20               # voice upload limits: size, length in seconds, name length, stored sample rate, count
# voice_max_seconds = 120
# voice_name_max_chars = 64
# voice_sample_rate = 24000
# max_voices = 100
#
# [[model]]
# key = "reader-de"
# backend = "audiocpp"
# kind = "tts"
# source = { file = "/var/lib/eliezer/models/audio-cpp/audio.cpp-gguf/Chatterbox-GGUF/chatterbox-q8_0.gguf" }
# vram_gb = 4.0                        # an estimate, to be measured
# requires_voice: Chatterbox has no speaker of its own (audio.cpp fails without a reference recording), so a request without a
# voice is answered with 400 and a hint instead of a 502. Leave it off for models with built-in speakers.
# extra = { family = "chatterbox", language = "de", requires_voice = true, default_voice = "mama", tts_options = { exaggeration = 0.5, temperature = 0.8 } }

# Speech recognition (speech to text) through whisper.cpp: POST /v1/audio/transcriptions (OpenAI shape). Uncomment both
# blocks. The service decodes the upload (MP3, M4A/AAC, Ogg, FLAC, WAV) itself, cuts long recordings into pieces and
# starts `whisper-server` (no ffmpeg needed). Download the model with
# `eliezer download cstr/whisper-large-v3-turbo-german-ggml ggml-model-q5_0.bin` (Apache-2.0, about 0.6 GB); list it in
# [huggingface] allow = ["cstr/whisper-large-v3-turbo-german-ggml"] first. First choice for German speech; alternatives are
# primeline/whisper-large-v3-turbo-german and openai/whisper-large-v3-turbo (a listening test decides).
# [backend.whispercpp]
# program = "/usr/libexec/x86_64-linux-gnu/eliezer/whisper-server"
# port_range = [24800, 24809]
# chunk_secs = 600                     # a long recording is cut into pieces of this length ...
# overlap_secs = 5                     # ... that overlap by this much
# max_file_mb = 100                    # limits of an upload; a model can set its own
# max_audio_minutes = 120
# split_on_word = true                 # segments end between words (false lets the program cut words in two); per model too
# max_segment_chars = 0                # 0 = the program's own wrapping; 20 to 400 wraps segments after that many characters
# load_timeout_secs = 300              # how long a model may take to load (1 to 3600)
# request_timeout_secs = 3600          # how long one piece of a recording may take (1 to 86400)
# stop_grace_secs = 15                 # how long the program gets to end after the stop, before it is killed (1 to 300)
# flash_attn = true                    # optional: --flash-attn / --no-flash-attn
# gpu_device = 0                       # optional: --device
#
# [[model]]
# key = "whisper-de"
# backend = "whispercpp"
# kind = "stt"
# source = { file = "/var/lib/eliezer/models/cstr/whisper-large-v3-turbo-german-ggml/ggml-model-q5_0.bin" }
# vram_gb = 2.0
# device = "auto"                      # "cpu" runs it on the processor without taking the GPU slot
# extra = { language = "de", threads = 8, max_file_mb = 200, max_audio_minutes = 180 }   # also split_on_word and max_segment_chars

[[model]]
key = "qwen/qwen3-coder-30b"
backend = "mistralrs"
source = { hf = "Qwen/Qwen3-Coder-30B-A3B-Instruct", revision = "main" }
kind = "llm"
priority = 10
max_context = 131072
default_context = 32768
parallel = 1
vision = false
reasoning = { options = ["none", "low", "medium", "high"], default = "medium" }
arch = { layers = 48, kv_heads = 4, head_dim = 128 }
size_gb = 17.3

[[model]]
key = "qwen-image"
backend = "sdcpp"
source = { file = "/var/lib/eliezer/models/qwen-image-2.1-UC-Q4_K_M.gguf" }
kind = "image"
priority = 5
vram_gb = 14.0
extra = { text_encoder = "/var/lib/eliezer/models/qwen3vl_8b_int8_convrot.safetensors", vae = "/var/lib/eliezer/models/qwen_image_2.1_vae_bf16.safetensors", steps = 20, cfg_scale = 4.0 }

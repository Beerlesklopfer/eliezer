[package]
name = "eliezer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Manager for local AI models on a scarce GPU"
publish.workspace = true
autotests = false

[dependencies]
eliezer-core.workspace = true
eliezer-api.workspace = true
eliezer-backend.workspace = true
eliezer-gpu.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "cli"
path = "../../tests/m2/cli.rs"

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "reload"
path = "../../tests/m3/reload.rs"

[package.metadata.deb]
name = "eliezer"
maintainer = "Jörg Bernau <Joerg.Bernau@web.de>"
copyright = "2026, Jörg Bernau"
license-file = ["../../LICENSE", "0"]
changelog = "../../debian/changelog"
section = "utils"
priority = "optional"
depends = "$auto, adduser"
extended-description = """\
Eliezer replaces LM Studio as the model server of MultiGPT. It loads chat, vision, \
embedding and image models on demand, unloads them when idle and lets them take turns \
on one GPU (NVIDIA or AMD). It serves OpenAI- and Anthropic-compatible HTTP interfaces \
and a management API.

This package contains the service, a systemd unit and a default configuration without \
models. The model runtimes are not connected yet."""
maintainer-scripts = "../../packaging/deb"
systemd-units = { unit-scripts = "../../target/deb-assets", enable = false, start = false }
assets = [
    ["target/release/eliezer", "usr/bin/", "755"],
    ["../../packaging/config.default.toml", "etc/eliezer/config.toml", "644"],
    ["../../packaging/config.example.toml", "usr/share/doc/eliezer/examples/", "644"],
    ["../../README.md", "usr/share/doc/eliezer/", "644"],
    ["../../INSTALL.MD", "usr/share/doc/eliezer/", "644"],
    ["../../packaging/deb/README.Debian", "usr/share/doc/eliezer/", "644"],
]

[workspace]
members = ["crates/*"]
exclude = ["tests/runtime/llamacpp"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
eliezer-core = { path = "crates/eliezer-core" }
eliezer-api = { path = "crates/eliezer-api" }
serde = { version = "1.0", features = ["derive"] }
serde_path_to_error = "0.1.20"
toml = "=0.9.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
eliezer-backend = { path = "crates/eliezer-backend" }
serde_json = "1.0"
futures-core = "0.3"
